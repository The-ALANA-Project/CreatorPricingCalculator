<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Public Assets</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #FEE6EA;
    }
    .asset {
      background: white;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
    button {
      background: #131718;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }
    button:hover {
      opacity: 0.9;
    }
    img {
      max-width: 100%;
      height: auto;
      margin: 10px 0;
      border: 1px solid #eee;
    }
    .success {
      color: #059669;
      font-weight: 600;
    }
    .error {
      color: #dc2626;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>Generate Public Assets</h1>
  <p>This page will help you download the favicon and OG image to add to the <code>/public</code> folder.</p>
  
  <div class="asset">
    <h2>Favicon</h2>
    <img id="faviconPreview" alt="Favicon preview" />
    <div><button onclick="downloadFavicon()">Download favicon.png</button></div>
    <div id="faviconStatus"></div>
  </div>
  
  <div class="asset">
    <h2>OG Image (Social Sharing)</h2>
    <img id="ogPreview" alt="OG image preview" />
    <div><button onclick="downloadOGImage()">Download og-image.png</button></div>
    <div id="ogStatus"></div>
  </div>

  <script type="module">
    // Import the asset URLs
    import { assetUrls } from './src/copy-public-assets.ts';
    
    // Display previews
    document.getElementById('faviconPreview').src = assetUrls.favicon;
    document.getElementById('ogPreview').src = assetUrls.ogImage;
    
    // Make download functions available globally
    window.downloadFavicon = async function() {
      const statusEl = document.getElementById('faviconStatus');
      statusEl.textContent = 'Downloading...';
      
      try {
        const response = await fetch(assetUrls.favicon);
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'favicon.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        statusEl.textContent = '✓ Downloaded! Save this to /public/favicon.png';
        statusEl.className = 'success';
      } catch (error) {
        statusEl.textContent = '✗ Error: ' + error.message;
        statusEl.className = 'error';
      }
    };
    
    window.downloadOGImage = async function() {
      const statusEl = document.getElementById('ogStatus');
      statusEl.textContent = 'Downloading...';
      
      try {
        const response = await fetch(assetUrls.ogImage);
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'og-image.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        statusEl.textContent = '✓ Downloaded! Save this to /public/og-image.png';
        statusEl.className = 'success';
      } catch (error) {
        statusEl.textContent = '✗ Error: ' + error.message;
        statusEl.className = 'error';
      }
    };
  </script>
</body>
</html>
